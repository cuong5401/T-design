<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laundry UI Preview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html {
            font-size: 20px
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #efefef;
            color: #333
        }

        .app {
            width: 100vw;
            height: 100vh;
            margin: 0;
            background: #efefef;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 0.0625rem solid #d8d8d8
        }

        .topbar {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 0.75rem 1rem 0.625rem;
            font-size: 0.875rem;
            color: #7a7a7a;
            background: #fff;
            gap: 1.5rem;
            flex-wrap: nowrap
        }

        .steps {
            display: flex;
            justify-content: center;
            gap: 0.875rem;
            align-items: center
        }

        .step {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            height: 3.875rem;
            background: #e8e8e8;
            border-radius: 62.4375rem;
            padding: 0 1.625rem 0 1.125rem;
            font-weight: 700;
            color: #9b9b9b;
            white-space: nowrap;
            line-height: 1
        }

        .step.active {
            background: #0f8dde;
            color: white
        }

        .step .num {
            width: 2.375rem;
            height: 2.375rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.92);
            color: #0f8dde;
            font-size: 1.125rem;
            font-weight: 800;
            line-height: 1;
            position: relative
        }

        .step:not(.active) .num {
            background: white;
            color: #999
        }

        .step .label-text {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.0625rem;
            line-height: 1
        }

        .store {
            text-align: right;
            line-height: 1.25;
            font-weight: 700;
            color: #6f6f6f;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.125rem
        }

        .title {
            background: white;
            padding: 0.75rem 1.25rem 0.875rem;
            font-size: 1.375rem;
            font-weight: 800;
            text-align: center
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 3.5rem;
            gap: 0.875rem;
            padding: 0.625rem 0.75rem;
            align-items: stretch;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden
        }

        #dynamic-main,
        #dynamic-side {
            min-height: 0;
            height: 100%
        }

        .content.course-mode,
        .content.payment-mode,
        .content.complete-mode {
            display: block;
            padding: 1.5rem 1.25rem 0.625rem;
            min-height: 0;
            height: 100%;
            overflow: hidden;
            background: #efefef
        }

        .machine-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: 0.75rem;
            height: 100%
        }

        .machine {
            height: auto;
            min-height: 0;
            background: white;
            border: 0.125rem solid #cfd3d6;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .machine.available {
            border-color: #0f8dde;
            box-shadow: inset 0 0 0 0.0625rem #8fcef5, 0 0.0625rem 0 rgba(0, 0, 0, 0.12);
            cursor: pointer
        }

        .machine.busy {
            background: #fff9f1;
            color: #333;
            border-color: #f0b35f;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
            opacity: 1
        }

        .machine.busy.selectable {
            cursor: pointer;
            border-color: #f0b35f;
            background: #fff9f1;
            opacity: 1
        }

        .machine.broken {
            background: #fff2f2;
            color: #c34b4b;
            border-color: #df8d8d;
            box-shadow: none;
            opacity: 0.55
        }

        .labels {
            display: flex;
            height: 1.625rem;
            font-size: 0.6875rem;
            font-weight: 700;
            color: white
        }

        .label {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3125rem;
            overflow: hidden
        }

        .label i {
            font-size: 0.625rem;
            line-height: 1
        }

        .wash {
            background: #1090df;
            clip-path: polygon(0 0, 100% 0, calc(100% - 0.625rem) 100%, 0 100%);
            margin-right: -0.125rem;
            padding-right: 0.5rem;
            z-index: 2
        }

        .dry {
            background: #f59b23;
            clip-path: polygon(0.625rem 0, 100% 0, 100% 100%, 0 100%);
            margin-left: -0.125rem;
            padding-left: 0.5rem
        }

        .label.single {
            clip-path: none;
            margin: 0;
            padding: 0
        }

        .machine .num {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 0.75rem;
            line-height: 1;
            color: #111
        }

        .busy .num {
            color: #333
        }

        .broken .num {
            color: #c34b4b
        }

        .status {
            text-align: center;
            margin-top: 0.625rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: #3f3f3f
        }

        .busy .status {
            color: #6b4a1b
        }

        .broken .status {
            color: #c34b4b;
            font-weight: 800
        }

        .extend-label {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #e08700;
            margin-top: 0.125rem
        }

        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            padding-top: 0.125rem;
            padding-bottom: 0.125rem
        }

        .arrowbox {
            width: 3.125rem;
            height: 4rem;
            background: #f3f3f3;
            border: 0.125rem solid #dbdbdb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b6b6b6;
            font-size: 1.75rem;
            font-weight: 700;
            user-select: none
        }

        .arrowbox.active {
            background: #ffffff;
            border-color: #bfc7cc;
            color: #5e666b;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
            cursor: pointer
        }

        .pager {
            font-size: 1.125rem;
            color: #333
        }

        .course-head {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.375rem 1.125rem 0.625rem 1.125rem;
            background: #fff;
            border-bottom: 0.125rem solid #7f8a91
        }

        .machine-badge {
            width: 5.375rem;
            height: 5.375rem;
            border-radius: 50%;
            background: #e3e3e3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            line-height: 1
        }

        .machine-badge .badge-label {
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem
        }

        .machine-badge .badge-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.125rem;
            font-weight: 800;
            color: #111;
            line-height: 1
        }

        .course-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #34454f;
            letter-spacing: 0.03125rem
        }

        .course-grid {
            display: flex;
            justify-content: center;
            gap: 1.75rem;
            padding-top: 5.625rem
        }

        .plan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(13.75rem, 13.75rem));
            gap: 1.375rem 0.875rem;
            justify-content: start;
            align-content: start;
            padding-top: 1.125rem
        }

        .price-topbar {
            display: flex;
            height: 2.75rem;
            margin-bottom: 1.625rem;
            overflow: hidden;
            border: 0.0625rem solid #a9b1b6;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.05)
        }

        .price-option {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: #fff;
            font-size: 1.375rem;
            font-weight: 700
        }

        .price-option i {
            font-size: 1.5rem;
            line-height: 1
        }

        .price-option.wash {
            background: #1090df;
            flex: 0 0 52%;
            clip-path: polygon(0 0, 100% 0, calc(100% - 1.125rem) 100%, 0 100%);
            padding-right: 1.125rem;
            z-index: 2
        }

        .price-option.dry {
            background: #e98f28;
            flex: 1 1 auto;
            clip-path: polygon(1.125rem 0, 100% 0, 100% 100%, 0 100%);
            margin-left: -0.25rem;
            padding-left: 1.125rem
        }

        .price-option.single {
            clip-path: none;
            margin-left: 0;
            padding-left: 0;
            padding-right: 0;
            flex: 1 1 auto
        }

        .plan-card {
            width: 13.75rem;
            min-height: 10.625rem;
            background: #fff;
            border: 0.1875rem solid #a7b0b5;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
            padding: 0.625rem 0.875rem 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer
        }

        .plan-name {
            width: 100%;
            text-align: center;
            font-size: 1.3125rem;
            font-weight: 500;
            color: #222;
            line-height: 1.22;
            min-height: 5.5rem;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .plan-divider {
            width: 100%;
            border-top: 0.1875rem solid #b7bec3;
            margin: 0.125rem 0 0.625rem
        }

        .plan-price {
            font-size: 2.125rem;
            font-weight: 500;
            color: #111;
            line-height: 1;
            white-space: nowrap
        }

        .payment-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 21.25rem;
            gap: 1.125rem;
            align-items: stretch;
            margin-top: 0.75rem
        }

        .payment-layout>div {
            min-height: 17.875rem;
            border-radius: 0.25rem
        }

        .payment-panel {
            width: 100%;
            margin: 0;
            background: #fff;
            border: 0.1875rem solid #a7b0b5;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
            padding: 1.125rem 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .card-panel {
            background: #fff;
            border: 0.1875rem solid #a7b0b5;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start
        }

        .card-panel.inserted {
            border-color: #0f8dde;
            background: #f4faff
        }

        .card-panel-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #34454f;
            margin-bottom: 0.875rem;
            text-align: center
        }

        .payment-row {
            display: flex;
            align-items: center;
            border-bottom: 0.125rem solid #d7dde1;
            padding: 0.875rem 0;
            gap: 0.75rem
        }

        .payment-row:last-of-type {
            border-bottom: none
        }

        .payment-label {
            flex: 0 0 8.75rem;
            font-size: 1.125rem;
            font-weight: 700;
            color: #4b5862
        }

        .payment-value {
            font-size: 1.625rem;
            font-weight: 700;
            color: #111
        }

        .payment-value.price {
            color: #0f8dde
        }

        .payment-guide {
            margin-top: 0;
            padding: 1.125rem 0.875rem;
            background: #f4f8fb;
            border: 0.125rem solid #c8d8e5;
            font-size: 1.3125rem;
            font-weight: 700;
            color: #2f3d47;
            text-align: center;
            line-height: 1.35;
            cursor: pointer
        }

        .payment-note {
            margin-top: 0.875rem;
            font-size: 1rem;
            font-weight: 700;
            color: #4e5a63;
            text-align: center
        }

        .payment-balance {
            margin-top: 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f8dde;
            text-align: center
        }

        .payment-actions {
            display: flex;
            justify-content: center;
            gap: 0.875rem;
            margin-top: 0.875rem
        }

        .payment-btn {
            min-width: 9.375rem;
            height: 3.125rem;
            border: 0.125rem solid #8e9aa3;
            background: #fff;
            color: #2f3d47;
            font-size: 1.25rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08)
        }

        .payment-btn.yes {
            border-color: #0f8dde;
            color: #0f8dde
        }

        .payment-btn.no {
            border-color: #a0a7ac;
            color: #4e5a63
        }

        .complete-panel {
            max-width: 47.5rem;
            margin: 1rem auto 0;
            background: #fff;
            border: 0.1875rem solid #0f8dde;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
            padding: 1.75rem 1.5rem;
            text-align: center
        }

        .complete-title {
            font-size: 2rem;
            font-weight: 800;
            color: #0f8dde;
            line-height: 1.2;
            margin-bottom: 1.25rem
        }

        .complete-balance-label {
            font-size: 1.25rem;
            font-weight: 700;
            color: #4b5862;
            margin-bottom: 0.5rem
        }

        .complete-balance-value {
            font-size: 2.75rem;
            font-weight: 800;
            color: #111;
            line-height: 1.1;
            margin-bottom: 1.125rem
        }

        .complete-thanks {
            font-size: 1.625rem;
            font-weight: 700;
            color: #2f3d47;
            line-height: 1.35
        }

        .complete-note {
            margin-top: 1rem;
            font-size: 1.35rem;
            font-weight: 700;
            color: #4b5862;
            line-height: 1.5
        }

        .complete-actions {
            display: flex;
            justify-content: center;
            gap: 0.875rem;
            margin-top: 1.5rem
        }

        .footer {
            display: flex;
            gap: 0.875rem;
            padding: 0.75rem 1.25rem 0.875rem;
            align-items: center;
            background: #fff
        }

        .btn {
            width: 7.5rem;
            height: 2.875rem;
            border: 0.125rem solid #8e9aa3;
            background: #ffffff;
            color: #2f3d47;
            font-size: 1.125rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 7.5rem;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
            cursor: pointer
        }

        .btn.cancel {
            border: 0.125rem solid #8e9aa3;
            background: #ffffff;
            color: #2f3d47
        }

        .btn .icon {
            font-size: 1.375rem;
            margin-right: 0.5rem;
            line-height: 1
        }

        .btn.disabled {
            background: #e6eaed;
            border-color: #c9d1d6;
            color: #9aa6ae;
            box-shadow: none;
            cursor: not-allowed;
            pointer-events: none
        }


        .course-card {
            width: 10.25rem;
            height: 9.9rem;
            background: #fff;
            border: 0.1875rem solid #a7b0b5;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .course-card.highlight {
            border-color: #0f8dde;
            box-shadow: inset 0 0 0 0.125rem #8fcef5, 0 0.125rem 0.375rem rgba(15, 141, 222, 0.18);
        }

        .course-card.disabled {
            opacity: 0.32;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(0.65);
        }

        .course-top {
            height: 1.7rem;
            display: flex;
        }

        .course-part {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
        }

        .course-part.wash {
            background: #1090df;
            clip-path: polygon(0 0, 100% 0, calc(100% - 0.8rem) 100%, 0 100%);
            flex: 1 1 55%;
            padding-right: 0.7rem;
            z-index: 2;
        }

        .course-part.dry {
            background: #e98f28;
            clip-path: polygon(0.8rem 0, 100% 0, 100% 100%, 0 100%);
            flex: 1 1 45%;
            padding-left: 0.7rem;
            margin-left: -0.15rem;
        }

        .course-top.single .course-part {
            clip-path: none;
            margin: 0;
            padding: 0;
            flex: 1 1 auto;
        }

        .course-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 500;
            color: #111;
            text-align: center;
            line-height: 1.2;
        }


        .dry-time-panel {
            max-width: 32rem;
            margin: 2rem auto 0;
            background: #fff;
            border: 0.1875rem solid #a7b0b5;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
            padding: 1.5rem;
            text-align: center;
        }

        .dry-time-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #34454f;
            margin-bottom: 1rem;
        }

        .dry-time-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0;
        }

        .dry-step-btn {
            width: 4.25rem;
            height: 4.25rem;
            border: 0.1875rem solid #e98f28;
            background: #fff;
            color: #e98f28;
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
        }

        .dry-step-btn.disabled {
            border-color: #c9d1d6;
            color: #b7bfc5;
            background: #e6eaed;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }

        .dry-time-display {
            min-width: 11rem;
            padding: 0.75rem 1.25rem;
            border: 0.1875rem solid #e98f28;
            background: #fff9f1;
        }

        .dry-minutes {
            font-size: 3rem;
            font-weight: 800;
            color: #111;
            line-height: 1;
        }

        .dry-price {
            margin-top: 0.5rem;
            font-size: 2rem;
            font-weight: 800;
            color: #e08700;
            line-height: 1;
        }

        .dry-time-note {
            font-size: 1rem;
            font-weight: 700;
            color: #4b5862;
            margin-top: 0.75rem;
        }

        .dry-time-confirm {
            min-width: 13rem;
            height: 3.25rem;
            margin-top: 1.25rem;
            border: 0.1875rem solid #0f8dde;
            background: #fff;
            color: #0f8dde;
            font-size: 1.25rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0.0625rem 0 rgba(0, 0, 0, 0.08);
        }

        /* Popup overlay */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999
        }

        .popup-overlay.hidden {
            display: none
        }

        .popup-box {
            background: #fff;
            padding: 2rem 2.5rem;
            min-width: 24rem;
            text-align: center;
            position: relative;
            box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.2)
        }

        .popup-back-overlay-btn {
            position: fixed;
            bottom: 0.875rem;
            left: 1.25rem;
            background: #f7f9fa;
            border: 0.125rem solid #0f8dde;
            padding: 0.4rem 0.875rem;
            font-size: 1rem;
            font-weight: 800;
            color: #0f8dde;
            cursor: pointer;
            z-index: 1002;
            width: 7.5rem;
            height: 2.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0.125rem 0.375rem rgba(15, 141, 222, 0.18)
        }

        .popup-back-overlay-btn.hidden {
            display: none
        }

        .popup-back-overlay-btn:hover {
            background: #eef8ff
        }

        .popup-title {
            font-size: 1.375rem;
            font-weight: 800;
            color: #34454f;
            margin-bottom: 1.5rem
        }

        .popup-machine-num {
            font-size: 5rem;
            font-weight: 800;
            color: #111;
            line-height: 1;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 5rem
        }

        .popup-subtitle {
            font-size: 1.125rem;
            font-weight: 700;
            color: #555;
            margin-bottom: 1.5rem
        }

        .popup-confirm-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #0f8dde;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 800;
            border: none;
            cursor: pointer
        }

        .popup-actions {
            display: flex;
            justify-content: center;
            gap: 0.875rem;
            margin-top: 0.5rem
        }

        .popup-confirm-btn.stop {
            background: #d84b4b
        }


        .popup-back-btn {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            background: none;
            border: 0.125rem solid #8e9aa3;
            padding: 0.4rem 0.875rem;
            font-size: 1rem;
            font-weight: 700;
            color: #2f3d47;
            cursor: pointer
        }
    </style>
</head>

<body data-template-id="__page-root" style="background: rgb(239, 239, 239);">
    <div class="app" data-template-id="app-container" style="background: rgb(239, 239, 239);">
        <div class="topbar" data-template-id="topbar" style="background: rgb(255, 255, 255);">
            <div class="steps">
                <div class="step active" data-step="1"><span class="num">1</span><span class="label-text">機械選択</span>
                </div>
                <div class="step" data-step="2"><span class="num">2</span><span class="label-text">コース選択</span>
                </div>
                <div class="step" data-step="3"><span class="num">3</span><span class="label-text">支払い</span>
                </div>
                <div class="step" data-step="4"><span class="num">4</span><span class="label-text">運転開始</span>
                </div>
            </div>
            <div class="store">
                <div id="time">
                    2026/06/18(水) 17:29:00
                </div>
                <div data-template-id="store-name"
                    style="color: rgb(111, 111, 111); font-weight: 700; font-style: normal; font-size: 20px;">ランドリー和田野店
                </div>
            </div>
        </div>
        <div id="dynamic-header">
            <div class="title" data-template-id="main-title"
                style="background: rgb(255, 255, 255); color: rgb(51, 51, 51); font-weight: 800; font-style: normal; font-size: 28px;">
                洗濯物を入れた機械番号を選択してください</div>
        </div>
        <div class="content">
            <div id="dynamic-main"></div>
            <div id="dynamic-side"></div>
        </div>
        <div class="footer">
            <div class="btn disabled" id="back-button">
                戻る
            </div>
            <div class="btn cancel disabled" id="cancel-button">
                中止
            </div>
        </div>
    </div>
    <!-- Popup -->
    <button class="popup-back-overlay-btn hidden" id="popup-back-overlay">戻る</button>
    <div class="popup-overlay hidden" id="popup-overlay">
        <div class="popup-box">
            <div class="popup-title" id="popup-title"></div>
            <div class="popup-machine-num" id="popup-num"></div>
            <div class="popup-subtitle" id="popup-subtitle">
                選択した機械が点滅していますか？
            </div><button class="popup-confirm-btn" id="popup-confirm">確認しました</button>
        </div>
    </div>
    <!-- Door open confirmation -->
    <div class="popup-overlay hidden" id="door-overlay">
        <div class="popup-box">
            <div class="popup-title">
                ドアが開いています
            </div>
            <div class="popup-machine-num" id="door-machine-num"></div>
            <div class="popup-subtitle" id="door-subtitle">
                ドアを閉じてください
            </div><button class="popup-confirm-btn" id="door-confirm">閉じました</button>
        </div>
    </div>
    <!-- Stop confirmation -->
    <div class="popup-overlay hidden" id="stop-overlay">
        <div class="popup-box">
            <div class="popup-title">
                運転を停止しますか？
            </div>
            <div class="popup-machine-num" id="stop-machine-num"></div>
            <div class="popup-subtitle">
                この機械の運転状態と残り時間を削除します。
            </div>
            <div class="popup-actions">
                <button class="popup-confirm-btn stop" id="stop-confirm">停止する</button>
            </div>
        </div>
    </div>
    <script>

        (function () {
            "use strict";

            var state = {
                screen: "machine-1",
                selectedMachine: null,
                selectedCourse: null,
                selectedPlan: null,
                cardInserted: false,
                remainingBalance: null,
                completeMode: "start",
                isExtension: false,
                dryMinutes: 8
            };

            var PREPAID_CARD_BALANCE = 3000;
            var COMPLETE_RETURN_DELAY_MS = 2000;
            var completeReturnTimerId = null;

            var courseLabel = {
                "wash-dry": "洗濯と乾燥",
                wash: "洗濯",
                dry: "乾燥"
            };

            var planByCourse = {
                "wash-dry": [
                    { name: "洗乾多<br>６０分", price: "1,100円", time: 60 },
                    { name: "洗乾普<br>８０分", price: "1,300円", time: 80 },
                    { name: "洗乾少<br>１００分", price: "1,500円", time: 100 }
                ],
                wash: [
                    { name: "標準<br>２５分", price: "700円", time: 25 }
                ]
            };

            var extensionPlanByCourse = {
                wash: [
                    { name: "延長<br>１０分", price: "100円", time: 10 }
                ],
                dry: [
                    { name: "延長<br>１０分", price: "100円", time: 10 }
                ]
            };

            var machineStatus = {};
            var machineTimer = {};
            var statusList = [
                "available", "available", "busy", "available",
                "available", "busy", "busy", "available",
                "available", "busy", "busy", "broken",
                "busy", "available", "available", "busy",
                "available", "available", "busy", "available",
                "available", "busy", "busy", "available",
                "available", "busy", "busy", "busy",
                "busy", "available"
            ];
            var timerList = [
                0, 0, 1, 0,
                0, 1, 2, 0,
                0, 4, 5, 7,
                8, 0, 0, 1,
                0, 0, 10, 0,
                0, 6, 20, 0,
                0, 20, 17, 14,
                30, 0
            ];

            for (var i = 1; i <= 30; i += 1) {
                machineStatus[i] = statusList[i - 1];
                machineTimer[i] = timerList[i - 1];
            }

            function machineLabel(number) {
                if (number === 8 || number === 9 || number === 24 || number === 25) {
                    return "wash-only";
                }

                if (number === 14 || number === 15 || number === 30) {
                    return "dry-only";
                }

                return "wash-dry";
            }

            function machineRange() {
                return state.screen === "machine-1" ? [1, 16] : [17, 30];
            }

            function canExtendMachine(number) {
                var type = machineLabel(number);
                return machineStatus[number] === "busy" && (type === "wash-dry" || type === "dry-only");
            }

            function canSelectMachine(number) {
                if (machineStatus[number] === "broken") return false;
                if (machineStatus[number] === "available") return true;
                return canExtendMachine(number);
            }

            function createMachineLabelHtml(number) {
                var type = machineLabel(number);

                if (type === "wash-only") {
                    return '<div class="labels"><div class="label wash single"><i class="fa-solid fa-water"></i><span>洗濯</span></div></div>';
                }

                if (type === "dry-only") {
                    return '<div class="labels"><div class="label dry single"><i class="fa-solid fa-tornado"></i><span>乾燥</span></div></div>';
                }

                return '<div class="labels"><div class="label wash"><i class="fa-solid fa-water"></i><span>洗濯</span></div><div class="label dry"><i class="fa-solid fa-tornado"></i><span>乾燥</span></div></div>';
            }

            function getPlansForCurrentCourse() {
                var course = state.selectedCourse || "dry";
                if (course === "dry") {
                    return [createDryPlan(state.dryMinutes)];
                }

                if (state.isExtension && extensionPlanByCourse[course]) {
                    return extensionPlanByCourse[course];
                }

                return planByCourse[course] || [];
            }

            function clampDryMinutes(minutes) {
                return Math.min(40, Math.max(8, minutes));
            }

            function createDryPlan(minutes) {
                var safeMinutes = clampDryMinutes(minutes || 8);
                var priceValue = (safeMinutes / 8) * 100;
                return {
                    name: (state.isExtension ? "延長<br>" : "乾燥<br>") + safeMinutes + "分",
                    price: formatYen(priceValue),
                    time: safeMinutes
                };
            }

            function getSelectedMachinePage() {
                return state.selectedMachine && state.selectedMachine > 16 ? "machine-2" : "machine-1";
            }

            function shouldShowCourseSelect() {
                return machineLabel(state.selectedMachine) === "wash-dry" && !state.isExtension;
            }

            function startCourseFlow(machineNum, isExtension) {
                var type = machineLabel(machineNum);
                state.selectedMachine = machineNum;
                state.selectedCourse = null;
                state.selectedPlan = null;
                state.cardInserted = false;
                state.remainingBalance = null;
                state.isExtension = !!isExtension;
                state.dryMinutes = 8;

                if (type === "wash-only") {
                    state.selectedCourse = "wash";
                    state.screen = "plan";
                    return;
                }

                if (type === "dry-only") {
                    state.selectedCourse = "dry";
                    state.screen = "plan";
                    return;
                }

                if (type === "wash-dry" && state.isExtension) {
                    state.selectedCourse = "dry";
                    state.screen = "plan";
                    return;
                }

                state.screen = "course";
            }

            function renderMachineGrid() {
                var range = machineRange();
                var start = range[0], end = range[1];
                var html = '<div class="machine-grid">';

                for (var i = start; i <= end; i += 1) {
                    var st = machineStatus[i];
                    var available = st === "available";
                    var broken = st === "broken";
                    var busy = st === "busy";
                    var selectable = canSelectMachine(i);
                    var cls = available ? "machine available" : broken ? "machine broken" : "machine busy";

                    if (busy && selectable) cls += " selectable";

                    var statusText = available ? "使用できます" : broken ? "調整中" : "残り" + machineTimer[i] + "分";

                    html += '<div class="' + cls + '"' + ((selectable || busy) ? ' data-machine="' + i + '"' : '') + '>';
                    html += createMachineLabelHtml(i);
                    html += '<div class="num">' + i + '</div>';
                    html += '<div class="status">' + statusText + '</div>';

                    if (canExtendMachine(i)) {
                        html += '<div class="extend-label">延長できます</div>';
                    }

                    html += '</div>';
                }

                if (state.screen === "machine-2") {
                    for (var j = end + 1; j <= 32; j += 1) {
                        html += '<div class="machine" style="visibility:hidden"></div>';
                    }
                }

                html += '</div>';
                return html;
            }

            function renderSidePager() {
                if (state.screen !== "machine-1" && state.screen !== "machine-2") return "";
                var isPage1 = state.screen === "machine-1";
                return '<div class="side">' +
                    '<div class="arrowbox' + (isPage1 ? "" : " active") + '" data-action="page-up"><i class="fa-solid fa-angle-up"></i></div>' +
                    '<div class="pager">' + (isPage1 ? "1/2" : "2/2") + '</div>' +
                    '<div class="arrowbox' + (isPage1 ? " active" : "") + '" data-action="page-down"><i class="fa-solid fa-angle-down"></i></div>' +
                    '</div>';
            }

            function renderCourseHeader() {
                var m = state.selectedMachine || "-";
                var title = state.isExtension ? "延長時間を選択してください" : "コースを選択してください";
                return '<div class="course-head"><div class="machine-badge"><div class="badge-label">機械番号</div><div class="badge-circle">' + m + '</div></div><div class="course-title">' + title + '</div></div>';
            }

            function renderCourseCard(course, bodyText, topHtml, enabled, highlight) {
                var cls = "course-card";
                if (!enabled) cls += " disabled";
                if (highlight) cls += " highlight";

                return '<div class="' + cls + '"' + (enabled ? ' data-course="' + course + '"' : '') + '>' +
                    topHtml +
                    '<div class="course-body">' + bodyText + '</div>' +
                    '</div>';
            }

            function renderCourseContent() {
                var type = machineLabel(state.selectedMachine);
                var isExtendWashDry = state.isExtension && type === "wash-dry";
                var washDryTop = '<div class="course-top"><div class="course-part wash"><i class="fa-solid fa-water"></i><span>洗濯</span></div><div class="course-part dry"><i class="fa-solid fa-tornado"></i><span>乾燥</span></div></div>';
                var washTop = '<div class="course-top single"><div class="course-part wash"><i class="fa-solid fa-water"></i><span>洗濯</span></div></div>';
                var dryTop = '<div class="course-top single"><div class="course-part dry"><i class="fa-solid fa-tornado"></i><span>乾燥</span></div></div>';

                if (type === "wash-only") {
                    return '<div class="course-grid">' + renderCourseCard("wash", "洗濯", washTop, true, false) + '</div>';
                }

                if (type === "dry-only") {
                    return '<div class="course-grid">' + renderCourseCard("dry", "乾燥", dryTop, true, false) + '</div>';
                }

                return '<div class="course-grid">' +
                    renderCourseCard("wash-dry", "洗濯と乾燥", washDryTop, !isExtendWashDry, false) +
                    renderCourseCard("wash", "洗濯", washTop, !isExtendWashDry, false) +
                    renderCourseCard("dry", "乾燥", dryTop, true, isExtendWashDry) +
                    '</div>';
            }

            function renderPriceTopbar() {
                var course = state.selectedCourse || "dry";
                if (course === "wash") return '<div class="price-topbar"><div class="price-option wash single"><i class="fa-solid fa-water"></i><span>洗濯</span></div></div>';
                if (course === "dry") return '<div class="price-topbar"><div class="price-option dry single"><i class="fa-solid fa-tornado"></i><span>乾燥</span></div></div>';
                return '<div class="price-topbar"><div class="price-option wash"><i class="fa-solid fa-water"></i><span>洗濯</span></div><div class="price-option dry"><i class="fa-solid fa-tornado"></i><span>乾燥</span></div></div>';
            }

            function renderDryTimeContent() {
                var plan = createDryPlan(state.dryMinutes);
                var minusDisabled = state.dryMinutes <= 8 ? " disabled" : "";
                var plusDisabled = state.dryMinutes >= 40 ? " disabled" : "";

                var dryTimeTitle = state.isExtension ? "延長時間を選択してください" : "乾燥時間を選択してください";

                return renderPriceTopbar() +
                    '<div class="dry-time-panel">' +
                    '<div class="dry-time-title">' + dryTimeTitle + '</div>' +
                    '<div class="dry-time-control">' +
                    '<button class="dry-step-btn' + minusDisabled + '" data-dry-change="-8">−</button>' +
                    '<div class="dry-time-display"><div class="dry-minutes">' + state.dryMinutes + '分</div><div class="dry-price">' + plan.price + '</div></div>' +
                    '<button class="dry-step-btn' + plusDisabled + '" data-dry-change="8">＋</button>' +
                    '</div>' +
                    '<div class="dry-time-note">８分ごとに１００円です。最大４０分まで選択できます。</div>' +
                    '<button class="dry-time-confirm" data-dry-confirm>この時間で支払う</button>' +
                    '</div>';
            }

            function renderPlanContent() {
                if (state.selectedCourse === "dry") {
                    return renderDryTimeContent();
                }

                var plans = getPlansForCurrentCourse();
                var h = "";

                plans.forEach(function (p, idx) {
                    h += '<div class="plan-card" data-plan-index="' + idx + '"><div class="plan-name">' + p.name + '</div><div class="plan-divider"></div><div class="plan-price">' + p.price + '</div></div>';
                });

                return renderPriceTopbar() + '<div class="plan-grid">' + h + '</div>';
            }

            function renderPaymentHeader() {
                var m = state.selectedMachine || "-";
                return '<div class="course-head"><div class="machine-badge"><div class="badge-label">機械番号</div><div class="badge-circle">' + m + '</div></div><div class="course-title">お支払い</div></div>';
            }

            function renderCompleteHeader() {
                var m = state.selectedMachine || "-";
                return '<div class="course-head"><div class="machine-badge"><div class="badge-label">機械番号</div><div class="badge-circle">' + m + '</div></div><div class="course-title">運転開始</div></div>';
            }

            function parsePrice(t) {
                var n = String(t || "").replace(/[^\d]/g, "");
                return n ? Number(n) : 0;
            }

            function formatYen(v) {
                return Number(v || 0).toLocaleString("ja-JP") + "円";
            }

            function renderPaymentContent() {
                var plan = state.selectedPlan || { name: "-", price: "-" };
                var statusName = state.isExtension ? "追加" : "新使用";
                var courseName = courseLabel[state.selectedCourse || "dry"] || "-";
                var paymentActionHtml = state.cardInserted ?
                    '<div class="payment-balance">カード残高: ' + formatYen(PREPAID_CARD_BALANCE) + '</div><div class="payment-actions"><button class="payment-btn yes" data-payment-decision="yes">支払う</button><button class="payment-btn no" data-payment-decision="no">支払わない</button></div>' :
                    '<div class="payment-note">プリペイドカードのみご利用いただけます</div>';
                var cardCls = state.cardInserted ? "card-panel inserted" : "card-panel";
                var guideText = state.cardInserted ? "プリペイドカードを読み取りました" : "プリペイドカードを挿入してください";
                return renderPriceTopbar() +
                    '<div class="payment-layout"><div class="payment-panel">' +
                    '<div class="payment-row"><div class="payment-label">ステータス</div><div class="payment-value">' + statusName + '</div></div>' +
                    '<div class="payment-row"><div class="payment-label">コース</div><div class="payment-value">' + courseName + '</div></div>' +
                    '<div class="payment-row"><div class="payment-label">プラン</div><div class="payment-value">' + plan.name.replace(/<br\s*\/?>/gi, " ") + '</div></div>' +
                    '<div class="payment-row"><div class="payment-label">金額</div><div class="payment-value price">' + plan.price + '</div></div>' +
                    '</div><div class="' + cardCls + '"><div class="card-panel-title">プリペイドカード</div><div class="payment-guide" data-insert-card>' + guideText + '</div>' + paymentActionHtml + '</div></div>';
            }

            function renderCompleteContent() {
                return '<div class="complete-panel"><div class="complete-title">お支払い完了です。</div><div class="complete-thanks">ご利用ありがとうございます。</div></div>';
            }

            function clearCompleteReturnTimer() {
                if (completeReturnTimerId !== null) {
                    clearTimeout(completeReturnTimerId);
                    completeReturnTimerId = null;
                }
            }

            function resetToMachineScreen() {
                state.screen = "machine-1";
                state.selectedMachine = null;
                state.selectedCourse = null;
                state.selectedPlan = null;
                state.cardInserted = false;
                state.remainingBalance = null;
                state.completeMode = "start";
                state.isExtension = false;
                state.dryMinutes = 8;
            }

            function syncCompleteReturnTimer() {
                clearCompleteReturnTimer();
                if (state.screen !== "complete") return;
                completeReturnTimerId = setTimeout(function () {
                    resetToMachineScreen();
                    render();
                }, COMPLETE_RETURN_DELAY_MS);
            }

            function updateStepState() {
                var steps = document.querySelectorAll("[data-step]");
                steps.forEach(function (s) { s.classList.remove("active"); });
                document.querySelector("[data-step='1']").classList.add("active");

                if (state.screen === "course" || state.screen === "plan" || state.screen === "payment" || state.screen === "complete") {
                    document.querySelector("[data-step='2']").classList.add("active");
                }

                if (state.screen === "payment" || state.screen === "complete") {
                    document.querySelector("[data-step='3']").classList.add("active");
                }

                if (state.screen === "complete") {
                    document.querySelector("[data-step='4']").classList.add("active");
                }
            }

            function updateTitleArea() {
                var dh = document.getElementById("dynamic-header");

                if (state.screen === "payment") {
                    dh.innerHTML = renderPaymentHeader();
                    return;
                }

                if (state.screen === "complete") {
                    dh.innerHTML = renderCompleteHeader();
                    return;
                }

                if (state.screen === "course" || state.screen === "plan") {
                    dh.innerHTML = renderCourseHeader();
                    return;
                }

                dh.innerHTML = '<div class="title">洗濯物を入れた機械番号を選択してください</div>';
            }

            function updateContentArea() {
                var dm = document.getElementById("dynamic-main");
                var ds = document.getElementById("dynamic-side");
                var content = document.querySelector(".content");
                content.classList.remove("course-mode", "payment-mode", "complete-mode");

                if (state.screen === "course") {
                    dm.innerHTML = renderCourseContent();
                    ds.innerHTML = "";
                    content.classList.add("course-mode");
                    return;
                }

                if (state.screen === "plan") {
                    dm.innerHTML = renderPlanContent();
                    ds.innerHTML = "";
                    content.classList.add("course-mode");
                    return;
                }

                if (state.screen === "payment") {
                    dm.innerHTML = renderPaymentContent();
                    ds.innerHTML = "";
                    content.classList.add("payment-mode");
                    return;
                }

                if (state.screen === "complete") {
                    dm.innerHTML = renderCompleteContent();
                    ds.innerHTML = "";
                    content.classList.add("complete-mode");
                    return;
                }

                dm.innerHTML = renderMachineGrid();
                ds.innerHTML = renderSidePager();
            }

            function updateFooterState() {
                var bb = document.getElementById("back-button");
                var cb = document.getElementById("cancel-button");
                var dis = state.screen === "machine-1" || state.screen === "machine-2" || state.screen === "complete";
                bb.classList.toggle("disabled", dis);
                cb.classList.toggle("disabled", dis);
            }

            function render() {
                updateStepState();
                updateTitleArea();
                updateContentArea();
                updateFooterState();
                syncCompleteReturnTimer();
            }

            var pendingMachine = null;
            var pendingMachineAction = "select";
            var doorWaitingMachine = null;
            var stopWaitingMachine = null;
            var longPressTimerId = null;
            var suppressNextMachineClick = false;
            var LONG_PRESS_STOP_MS = 2000;

            function showPopup(machineNum, action) {
                pendingMachine = machineNum;
                pendingMachineAction = action || "select";
                var isBusy = machineStatus[machineNum] === "busy";
                var titleText = "機械番号を確認してください。";

                if (pendingMachineAction === "stop") {
                    titleText = "停止する機械番号を確認してください。";
                } else if (isBusy) {
                    titleText = "延長する機械番号を確認してください。";
                }

                document.getElementById("popup-title").textContent = titleText;
                document.getElementById("popup-num").textContent = machineNum;
                document.getElementById("popup-overlay").classList.remove("hidden");
                document.getElementById("popup-back-overlay").classList.remove("hidden");
            }

            function hidePopup() {
                document.getElementById("popup-overlay").classList.add("hidden");
                document.getElementById("popup-back-overlay").classList.add("hidden");
                pendingMachine = null;
                pendingMachineAction = "select";
                render();
            }

            function showDoorPopup(machineNum) {
                doorWaitingMachine = machineNum;
                document.getElementById("door-machine-num").textContent = machineNum;
                document.getElementById("door-overlay").classList.remove("hidden");
                document.getElementById("popup-back-overlay").classList.remove("hidden");
            }

            function hideDoorPopup() {
                document.getElementById("door-overlay").classList.add("hidden");
                document.getElementById("popup-back-overlay").classList.add("hidden");
                doorWaitingMachine = null;
                render();
            }

            function showStopPopup(machineNum) {
                stopWaitingMachine = machineNum;
                document.getElementById("stop-machine-num").textContent = machineNum;
                document.getElementById("stop-overlay").classList.remove("hidden");
                document.getElementById("popup-back-overlay").classList.remove("hidden");
            }

            function hideStopPopup() {
                document.getElementById("stop-overlay").classList.add("hidden");
                document.getElementById("popup-back-overlay").classList.add("hidden");
                stopWaitingMachine = null;
                render();
            }

            function clearLongPressTimer() {
                if (longPressTimerId !== null) {
                    clearTimeout(longPressTimerId);
                    longPressTimerId = null;
                }
            }

            document.getElementById("popup-confirm").addEventListener("click", function () {
                if (pendingMachine == null) return;
                var machineNum = pendingMachine;
                var action = pendingMachineAction;
                var wasBusy = machineStatus[machineNum] === "busy";

                document.getElementById("popup-overlay").classList.add("hidden");
                pendingMachine = null;
                pendingMachineAction = "select";

                if (action === "stop") {
                    showStopPopup(machineNum);
                    return;
                }

                if (wasBusy) {
                    startCourseFlow(machineNum, true);
                    document.getElementById("popup-back-overlay").classList.add("hidden");
                    render();
                    return;
                }

                document.getElementById("popup-back-overlay").classList.add("hidden");
                showDoorPopup(machineNum);
            });

            document.getElementById("door-confirm").addEventListener("click", function () {
                if (doorWaitingMachine == null) return;
                startCourseFlow(doorWaitingMachine, false);
                hideDoorPopup();
                render();
            });

            document.getElementById("stop-confirm").addEventListener("click", function () {
                if (stopWaitingMachine == null) return;
                machineStatus[stopWaitingMachine] = "available";
                machineTimer[stopWaitingMachine] = 0;
                hideStopPopup();
            });

            document.getElementById("popup-back-overlay").addEventListener("click", function () {
                if (stopWaitingMachine !== null) {
                    hideStopPopup();
                } else if (doorWaitingMachine !== null) {
                    hideDoorPopup();
                } else if (pendingMachine !== null) {
                    hidePopup();
                }
            });

            document.body.addEventListener("pointerdown", function (e) {
                if (state.screen !== "machine-1" && state.screen !== "machine-2") return;
                if (e.pointerType === "mouse" && e.button !== 0) return;

                var machineEl = e.target.closest("[data-machine]");
                if (!machineEl) return;

                var num = Number(machineEl.getAttribute("data-machine"));
                if (machineStatus[num] !== "busy") return;

                clearLongPressTimer();
                longPressTimerId = setTimeout(function () {
                    longPressTimerId = null;
                    suppressNextMachineClick = true;
                    showPopup(num, "stop");
                    setTimeout(function () {
                        suppressNextMachineClick = false;
                    }, 600);
                }, LONG_PRESS_STOP_MS);
            });

            ["pointerup", "pointercancel", "pointerleave"].forEach(function (eventName) {
                document.body.addEventListener(eventName, function () {
                    clearLongPressTimer();
                });
            });

            document.body.addEventListener("click", function (e) {
                var actionEl = e.target.closest("[data-action]");
                var machineEl = e.target.closest("[data-machine]");
                var courseEl = e.target.closest("[data-course]");
                var planEl = e.target.closest("[data-plan-index]");

                if (actionEl) {
                    var action = actionEl.getAttribute("data-action");

                    if (action === "page-down" && state.screen === "machine-1") {
                        state.screen = "machine-2";
                        render();
                    } else if (action === "page-up" && state.screen === "machine-2") {
                        state.screen = "machine-1";
                        render();
                    }

                    return;
                }

                if (machineEl) {
                    var num = Number(machineEl.getAttribute("data-machine"));
                    if (suppressNextMachineClick) {
                        suppressNextMachineClick = false;
                        return;
                    }
                    if (!canSelectMachine(num)) return;
                    showPopup(num, "select");
                    return;
                }

                if (courseEl && state.screen === "course") {
                    var requestedCourse = courseEl.getAttribute("data-course");

                    if (state.isExtension && machineLabel(state.selectedMachine) === "wash-dry" && requestedCourse !== "dry") {
                        return;
                    }

                    state.selectedCourse = requestedCourse;
                    state.selectedPlan = null;
                    state.cardInserted = false;
                    state.screen = "plan";
                    render();
                    return;
                }

                var dryChangeEl = e.target.closest("[data-dry-change]");
                if (dryChangeEl && state.screen === "plan" && state.selectedCourse === "dry") {
                    var diff = Number(dryChangeEl.getAttribute("data-dry-change"));
                    state.dryMinutes = clampDryMinutes(state.dryMinutes + diff);
                    render();
                    return;
                }

                if (e.target.closest("[data-dry-confirm]") && state.screen === "plan" && state.selectedCourse === "dry") {
                    state.selectedPlan = createDryPlan(state.dryMinutes);
                    state.cardInserted = false;
                    state.screen = "payment";
                    render();
                    return;
                }

                if (planEl && state.screen === "plan") {
                    var plans = getPlansForCurrentCourse();
                    var idx = Number(planEl.getAttribute("data-plan-index"));
                    state.selectedPlan = plans[idx] || null;
                    state.cardInserted = false;
                    state.screen = "payment";
                    render();
                    return;
                }

                if (e.target.closest("[data-insert-card]") && state.screen === "payment") {
                    state.cardInserted = true;
                    render();
                    return;
                }

                var payEl = e.target.closest("[data-payment-decision]");
                if (payEl && state.screen === "payment") {
                    var dec = payEl.getAttribute("data-payment-decision");

                    if (dec === "yes") {
                        var price = parsePrice((state.selectedPlan && state.selectedPlan.price) || "0");
                        state.remainingBalance = Math.max(PREPAID_CARD_BALANCE - price, 0);
                        machineStatus[state.selectedMachine] = "busy";
                        machineTimer[state.selectedMachine] += state.selectedPlan.time;
                        state.completeMode = state.isExtension ? "add" : "start";
                        state.screen = "complete";
                    } else {
                        resetToMachineScreen();
                    }

                    render();
                    return;
                }

                var compEl = e.target.closest("[data-complete-action]");
                if (compEl && state.screen === "complete") {
                    var act = compEl.getAttribute("data-complete-action");
                    clearCompleteReturnTimer();

                    if (act === "back") {
                        resetToMachineScreen();
                        render();
                    } else if (act === "add") {
                        var extendCourse = machineLabel(state.selectedMachine) === "wash-only" ? "wash" : "dry";
                        var addPlan = extensionPlanByCourse[extendCourse][0];
                        var ap = parsePrice(addPlan.price);
                        var cb2 = state.remainingBalance == null ? PREPAID_CARD_BALANCE : state.remainingBalance;

                        if (cb2 >= ap) {
                            state.remainingBalance = cb2 - ap;
                            machineTimer[state.selectedMachine] += addPlan.time;
                            state.completeMode = "add";
                        }

                        render();
                    }

                    return;
                }

                if (e.target.closest("#back-button")) {
                    if (pendingMachine !== null) {
                        hidePopup();
                        return;
                    }

                    if (doorWaitingMachine !== null) {
                        hideDoorPopup();
                        return;
                    }

                    if (stopWaitingMachine !== null) {
                        hideStopPopup();
                        return;
                    }

                    if (state.screen === "course") {
                        state.screen = getSelectedMachinePage();
                        state.isExtension = false;
                        render();
                        return;
                    }

                    if (state.screen === "plan") {
                        if (shouldShowCourseSelect()) {
                            state.screen = "course";
                            state.selectedCourse = null;
                        } else {
                            state.screen = getSelectedMachinePage();
                            state.isExtension = false;
                        }

                        state.selectedPlan = null;
                        state.cardInserted = false;
                        state.remainingBalance = null;
                        render();
                        return;
                    }

                    if (state.screen === "payment") {
                        state.screen = "plan";
                        state.remainingBalance = null;
                        state.cardInserted = false;
                        render();
                    }
                }

                if (e.target.closest("#cancel-button")) {
                    if (state.screen !== "machine-1" && state.screen !== "machine-2" && state.screen !== "complete") {
                        resetToMachineScreen();
                        render();
                    }
                }
            });

            document.addEventListener("DOMContentLoaded", function () {
                render();
            });

            setInterval(function () {
                var timeE = document.getElementById("time");
                var ds = ["日", "月", "火", "水", "木", "金", "土"];
                var now = new Date();
                var y = now.getFullYear();
                var mo = String(now.getMonth() + 1).padStart(2, "0");
                var d = now.getDate();
                var day = ds[now.getDay()];
                var h = String(now.getHours()).padStart(2, "0");
                var mi = String(now.getMinutes()).padStart(2, "0");
                var sec = String(now.getSeconds()).padStart(2, "0");
                timeE.textContent = y + "/" + mo + "/" + d + "(" + day + ") " + h + ":" + mi + ":" + sec;
            }, 1000);

            setInterval(function () {
                for (var i = 1; i <= 30; i += 1) {
                    if (machineTimer[i] > 0) {
                        machineTimer[i] -= 1;

                        if (machineTimer[i] <= 0) {
                            machineTimer[i] = 0;

                            if (machineStatus[i] === "busy") {
                                machineStatus[i] = "available";
                            }
                        }
                    }
                }

                if (state.screen === "machine-1" || state.screen === "machine-2") {
                    render();
                }
            }, 60000);
        })();

    </script>
</body>

</html>
